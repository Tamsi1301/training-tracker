<!doctype html>
<html lang="de">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%VITE_APP_NAME%</title>
    <meta name="description" content="Persönlicher Trainings-Tracker für Bouldern, Kraftsport und Laufen." />
